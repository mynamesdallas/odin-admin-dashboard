<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Odin | Admin Dashboard</title>
</head>
<body>
    <div class="container">

        <div class="header">
            <div class="header-top">
                <div class="search">
                    <img src="images/magnify.svg" alt="Search Icon" width="20">
                    <input type="text" name="search" id="search">
                </div>
                <div class="profile">
                    <img src="images/bell-ring.svg" alt="Message" width="20">
                    <img src="images/account-circle.svg" alt="Profile Picture" width="35">
                    <span class="username">Sterling Archer</span>
                </div>
            </div>
            <div class="header-bottom">
                <div class="welcome">
                    <img src="images/account-circle.svg" alt="Profile Picture" width="55">
                    <div class="greeting">
                        <p>Hi there,</p>
                        <p class="name">Sterling Archer (@Sterling)</p>
                    </div>
                </div>
                <div class="buttons">
                    <button class="new">New</button>
                    <button class="upload">Upload</button>
                    <button class="share">Share</button>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="logo">
                <img src="images/view-dashboard-variant-outline.svg" alt="Dashboard logo" width="40" height="38">
                <h1>Dashboard</h1>
            </div>
            <div class="nav">
                <ul>
                    <li><a href="#home"><img src="images/home.svg" alt="Home icon" width="20">Home</a></li>
                    <li><a href="#profile"><img src="images/card-account-details-outline.svg" alt="Account icon" width="20">Profile</a></li>
                    <li><a href="#messages"><img src="images/message.svg" alt="Message icon" width="20">Messages</a></li>
                    <li><a href="#history"><img src="images/clock-time-three.svg" alt="History icon" width="20">History</a></li>
                    <li><a href="#tasks"><img src="images/clipboard-list.svg" alt="Tasks icon" width="20">Tasks</a></li>
                    <li><a href="#communities"><img src="images/account-group.svg" alt="Community icon" width="20">Communities</a></li>
                </ul>
            </div>
            <div class="options">
                <ul>
                    <li><a href="#settings"><img src="images/cog.svg" alt="Settings icon" width="20">Settings</a></li>
                    <li><a href="#support"><img src="images/help-box.svg" alt="Support icon" width="20">Support</a></li>
                    <li><a href="#privacy"><img src="images/shield-check.svg" alt="Privacy icon" width="20">Privacy</a></li>
                </ul>
            </div>
        </div>

        <div class="content">

        </div>
    </div>
</body>
</html>
