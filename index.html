<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Odin | Admin Dashboard</title>
</head>
<body>
    <div class="container">

        <div class="header">
            <div class="header-top">
                <div class="search">
                    <img src="images/search.svg" alt="Search Icon">
                    <input type="text" name="search" id="search">
                </div>
                <div class="profile">
                    <img src="images/notification.svg" alt="Message">
                    <img src="images/profile-pic.svg" alt="Profile Picture">
                    <span class="username">Sterling Archer</span>
                </div>
            </div>
            <div class="header-bottom">
                <div class="welcome">
                    <img src="images/profile-pic.svg" alt="Profile Picture">
                    <p>Hi there,</p>
                    <p class="name">Sterling Archer</p>
                </div>
                <div class="buttons">
                    <button class="new">New</button>
                    <button class="upload">Upload</button>
                    <button class="share">Share</button>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="logo">
                <img src="" alt="Dashboard logo">
            </div>
            <div class="nav">
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#profile">Profile</a></li>
                    <li><a href="#messages">Messages</a></li>
                    <li><a href="#history">History</a></li>
                    <li><a href="#tasks">Tasks</a></li>
                    <li><a href="#communities">Communities</a></li>
                </ul>
            </div>
            <div class="options">
                <ul>
                    <li><a href="#settings">Settings</a></li>
                    <li><a href="#support">Support</a></li>
                    <li><a href="#privacy">Privacy</a></li>
                </ul>
            </div>
        </div>

        <div class="content">

        </div>
    </div>
</body>
</html>
